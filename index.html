 <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Diwali - Animated Wish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Great+Vibes&family=Marcellus&family=Poppins:wght@300;400;500;600;700&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --gold-primary: #ffc83d;
      --gold-light: #ffe58f;
      --gold-dark: #b8860b;
      --crimson-deep: #800000;
      --crimson-glow: #b31217;
      --amber-glow: #ff7a1f;
      --bg-dark: #0d0216;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Canvas */
    #c {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
    }

    /* Stages */
    .stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      z-index: 10;
      overflow: hidden;
    }

    .stage.on {
      opacity: 1;
      visibility: visible;
    }

    /* Sound Mute Button */
    .mute {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #ffd700;
      font-size: 1.25rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 200, 61, 0.3);
      transition: all 0.3s ease;
    }

    .mute:hover {
      transform: scale(1.1);
      background: rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 20px rgba(255, 200, 61, 0.6);
    }



    /* =========================================================
       STAGE 0: DOORS & WELCOME SCREEN
       ========================================================= */
    #s0 {
      background: radial-gradient(ellipse at center, #9e1319 0%, #680508 60%, #3a0003 100%);
      perspective: 1000px;
    }

    /* Split Marigold Doors */
    .door-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      z-index: 25;
      pointer-events: auto;
      cursor: pointer;
    }

    .door-container.door-open {
      pointer-events: none;
    }

    .door {
      width: 50%;
      height: 100%;
      position: relative;
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      background-color: #d84315;
      background-image: 
        radial-gradient(#ffca28 20%, transparent 20%),
        radial-gradient(#ff6f00 20%, transparent 20%),
        radial-gradient(#ffb300 35%, transparent 35%);
      background-size: 40px 40px, 40px 40px, 80px 80px;
      background-position: 0 0, 20px 20px, 0 0;
      border-left: 2px solid #ffe082;
      border-right: 2px solid #ffe082;
    }

    .door-l {
      border-right: 4px solid #ffd700;
      transform-origin: left center;
    }

    .door-r {
      border-left: 4px solid #ffd700;
      transform-origin: right center;
    }

    .door-handle {
      position: absolute;
      top: 50%;
      width: 24px;
      height: 50px;
      background: linear-gradient(135deg, #fff7cc, #ffc83d, #b8860b);
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      transform: translateY(-50%);
    }

    .door-l .door-handle { right: 8px; }
    .door-r .door-handle { left: 8px; }

    .door-open .door-l {
      transform: translateX(-100%) rotateY(-20deg);
    }
    .door-open .door-r {
      transform: translateX(100%) rotateY(20deg);
    }

    /* Stage 0 Inner Content */
    .s0-content {
      z-index: 15;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin-top: 45px;
      animation: floatSlow 4s ease-in-out infinite;
    }

    .shubh-title {
      font-family: 'Rozha One', 'Yatra One', serif;
      font-size: 3.2rem;
      background: linear-gradient(180deg, #fff9db 0%, #ffdf79 35%, #e5a711 70%, #9e6900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 25px rgba(255, 200, 61, 0.6));
      margin-bottom: 24px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .badge-jgm {
      background: linear-gradient(135deg, #7b1fa2, #4a148c);
      border: 3px solid #ffc83d;
      padding: 12px 36px;
      border-radius: 40px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 200, 61, 0.4);
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      animation: badgePulse 2.5s ease-in-out infinite;
    }

    .badge-jgm::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transform: rotate(30deg);
      animation: shine 3s infinite;
    }

    .badge-text {
      font-family: 'Rozha One', 'Yatra One', serif;
      font-size: 2.2rem;
      color: #fff9e6;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .btn-gold {
      background: linear-gradient(135deg, #ffd54f, #ffb300, #ff8f00);
      color: #4a1500;
      font-weight: 700;
      border: none;
      padding: 12px 32px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 179, 0, 0.5);
      transition: all 0.3s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Poppins', sans-serif;
    }

    .btn-gold:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 25px rgba(255, 179, 0, 0.7);
    }

    /* =========================================================
       STAGE 1: SACRED DIYA SHRINE
       ========================================================= */
    #s1 {
      background: radial-gradient(ellipse at center, #2e0817 0%, #15020c 65%, #080005 100%);
    }

    .shrine-container {
      position: relative;
      width: 320px;
      height: 440px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: -25px;
    }

    .jharokha-frame {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.8));
    }

    .diya-altar {
      position: absolute;
      bottom: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 20;
    }

    /* Clay Diya SVG */
    .clay-diya {
      width: 140px;
      height: 80px;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6));
    }

    .clay-diya:hover {
      transform: scale(1.04);
    }

    /* Diya Flame */
    .diya-flame {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 32px;
      height: 52px;
      opacity: 0;
      transform-origin: bottom center;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
      pointer-events: none;
    }

    .diya-flame.lit {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      animation: flameFlicker 1.5s ease-in-out infinite alternate;
    }

    .flame-outer {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 52px;
      background: radial-gradient(ellipse at bottom, #ff3d00 0%, #ff9100 60%, transparent 80%);
      border-radius: 50% 50% 20% 20% / 80% 80% 20% 20%;
      filter: blur(1px);
    }

    .flame-inner {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 34px;
      background: radial-gradient(ellipse at bottom, #ffffff 10%, #fff7a0 50%, #ffab00 90%);
      border-radius: 50% 50% 20% 20% / 80% 80% 20% 20%;
    }

    .diya-halo {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255, 183, 3, 0.45) 0%, rgba(255, 107, 0, 0.2) 40%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      transition: all 0.8s ease;
      pointer-events: none;
      z-index: 10;
    }

    .diya-halo.lit {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      animation: haloPulse 2s ease-in-out infinite alternate;
    }

    .hint-text {
      position: absolute;
      bottom: -65px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #fff9db;
      text-align: center;
      width: max-content;
      max-width: 92%;
      z-index: 25;
      padding: 10px 26px;
      border-radius: 30px;
      background: radial-gradient(ellipse at center, rgba(255, 179, 0, 0.3) 0%, rgba(255, 107, 0, 0.1) 60%, transparent 80%);
      box-shadow: 0 0 25px rgba(255, 183, 3, 0.35), inset 0 0 15px rgba(255, 200, 61, 0.2);
      border: 1.5px solid rgba(255, 200, 61, 0.45);
      backdrop-filter: blur(6px);
      text-shadow: 
        0 0 8px #ffb300,
        0 0 16px #ff8f00,
        0 0 26px #ff6f00,
        0 0 40px rgba(255, 111, 0, 0.85);
      animation: illuminateGlow 2.5s ease-in-out infinite alternate;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .hint-text.lit {
      color: #ffffff;
      border-color: rgba(255, 235, 150, 0.8);
      background: radial-gradient(ellipse at center, rgba(255, 200, 61, 0.45) 0%, rgba(255, 140, 0, 0.2) 60%, transparent 85%);
      box-shadow: 0 0 40px rgba(255, 200, 61, 0.7), inset 0 0 20px rgba(255, 255, 255, 0.3);
      text-shadow: 
        0 0 10px #ffffff,
        0 0 20px #ffca28,
        0 0 35px #ff9800,
        0 0 60px #ff6f00;
      transform: translateX(-50%) scale(1.05);
    }

    /* =========================================================
       STAGE 2: FIRECRACKER SKY ROCKET
       ========================================================= */
    #s2 {
      background: radial-gradient(ellipse at bottom, #1d0738 0%, #0d0216 70%, #05000a 100%);
    }

    .hint2 {
      position: absolute;
      top: 32%;
      font-size: 1.25rem;
      color: #ffe082;
      font-weight: 500;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(255, 193, 7, 0.7);
      animation: pulseHint 1.8s infinite;
      text-align: center;
      width: 100%;
      z-index: 20;
    }

    #rocket {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 30;
      transition: transform 0.1s linear;
    }

    #rocket .cone {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 34px solid #d32f2f;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }

    #rocket .tube {
      width: 28px;
      height: 80px;
      background: repeating-linear-gradient(
        45deg,
        #f57c00,
        #f57c00 10px,
        #ffd54f 10px,
        #ffd54f 20px,
        #d32f2f 20px,
        #d32f2f 30px
      );
      border-radius: 3px;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.6), 0 4px 10px rgba(0, 0, 0, 0.5);
      border: 1px solid #ffd54f;
    }

    #rocket .stick {
      width: 4px;
      height: 100px;
      background: #8d6e63;
      margin-top: -5px;
      border-radius: 1px;
    }

    #rocket .fuse {
      position: absolute;
      bottom: 70px;
      left: 20px;
      width: 16px;
      height: 16px;
      border-right: 2px dashed #4e342e;
      border-bottom: 2px dashed #4e342e;
      border-radius: 0 0 10px 0;
    }

    #rocket .spark {
      position: absolute;
      bottom: 66px;
      left: 32px;
      width: 8px;
      height: 8px;
      background: #ffeb3b;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff9800, 0 0 20px #ffeb3b;
      opacity: 0;
    }

    #rocket.ignited .spark {
      opacity: 1;
      animation: sparkFlicker 0.1s infinite alternate;
    }

    #rocket.launching {
      animation: rocketAscend 1.1s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
    }

    /* =========================================================
       STAGE 3: MAIN GREETING CARD & FIREWORKS
       ========================================================= */
    #s3 {
      background: transparent;
      pointer-events: none;
    }

    .card-wrap {
      width: 90%;
      max-width: 420px;
      max-height: 88vh;
      overflow-y: auto;
      background: rgba(28, 12, 44, 0.88);
      border: 1.5px solid rgba(255, 200, 61, 0.45);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 179, 0, 0.25);
      backdrop-filter: blur(12px);
      padding: 24px 20px;
      text-align: center;
      position: relative;
      z-index: 50;
      pointer-events: auto;
      scrollbar-width: none;
      transition: all 0.4s ease;
    }

    .card-wrap::-webkit-scrollbar { display: none; }

    .card {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .card.active {
      display: flex;
    }

    /* Card 1: Creator Form */
    #c1 h2 {
      font-family: 'Rozha One', 'Yatra One', serif;
      font-size: 2.2rem;
      background: linear-gradient(180deg, #fff9db 0%, #ffc83d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    #c1 p {
      font-size: 0.95rem;
      color: #e0d0f5;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 14px;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 200, 61, 0.35);
      background: rgba(15, 5, 25, 0.65);
      color: #fff;
      font-size: 0.95rem;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input:focus {
      border-color: #ffc83d;
      box-shadow: 0 0 12px rgba(255, 200, 61, 0.4);
    }

    input::placeholder {
      color: rgba(220, 200, 240, 0.5);
    }

    .row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      background: linear-gradient(135deg, #d84315, #f57c00);
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 4px 15px rgba(216, 67, 21, 0.4);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 124, 0, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Card 2: Interactive Letter & Fireworks */
    .rg {
      width: 76px;
      height: 76px;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 10px rgba(255, 200, 61, 0.6));
      animation: rotateRangoli 25s linear infinite;
    }

    .rg path {
      fill: none;
      stroke: #ffc83d;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 0;
    }

    #to {
      font-family: 'Rozha One', 'Yatra One', serif;
      font-size: 1.7rem;
      background: linear-gradient(180deg, #fff7cc 0%, #ffc83d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      word-break: break-word;
    }

    /* Secret Envelope */
    .env {
      width: 100%;
      height: 90px;
      background: linear-gradient(135deg, #b71c1c, #880e4f);
      border: 1.5px solid #ffc83d;
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 0, 0, 0.3);
      margin-bottom: 14px;
      transition: all 0.35s ease;
      perspective: 600px;
    }

    .env:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 25px rgba(255, 200, 61, 0.3);
    }

    .env .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: linear-gradient(180deg, #d32f2f, #9a0007);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-bottom: 1.5px solid #ffc83d;
      transform-origin: top center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    .env.opened .flap {
      transform: rotateX(180deg);
    }

    .env .seal {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #ffca28, #f57f17);
      border-radius: 50%;
      border: 2px solid #fff9c4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: 5;
      margin-bottom: 6px;
      transition: transform 0.3s ease;
    }

    .env.opened .seal {
      opacity: 0;
      pointer-events: none;
    }

    .env span {
      font-size: 0.85rem;
      color: #fff9e6;
      font-weight: 500;
      letter-spacing: 0.5px;
      z-index: 3;
    }

    /* Unrolled Secret Letter Scroll */
    .scr {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      width: 100%;
      background: #fffdf5;
      color: #3e2723;
      border-radius: 14px;
      border: 2px solid #e0b034;
      padding: 0 16px;
      margin-bottom: 0;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
      transition: max-height 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease, padding 0.5s ease, margin-bottom 0.5s ease;
      text-align: center;
    }

    .scr.show {
      max-height: 250px;
      opacity: 1;
      padding: 16px;
      margin-bottom: 16px;
    }

    .scr #msg {
      font-family: 'Marcellus', serif;
      font-size: 1rem;
      line-height: 1.55;
      color: #4a2c00;
      margin-bottom: 8px;
    }

    .scr #by {
      font-family: 'Great Vibes', cursive;
      font-size: 1.45rem;
      color: #b71c1c;
      font-weight: 700;
      text-align: right;
    }

    /* Footer Attribution */
    .cr {
      font-size: 0.72rem;
      color: rgba(255, 235, 175, 0.65);
      margin-top: 14px;
      letter-spacing: 0.3px;
    }

  <section class="stage" id="s2">
    <div class="hint2" id="h3">Double tap to light it 🚀</div>
    <div id="rocket">
      <i class="cone"></i>

    // Audio Context Initializer (Web Audio API for fireworks synth sound effects)
    function initAudio() {
      if (!AC) {

      if (bgAudio && snd) {

    // Synthesized Sound Effects using Web Audio API
    function pop2(big) {
      if (!snd || !AC) return;
      try {

        const osc = AC.createOscillator();
        const gain = AC.createGain();

        // Low boom or pop pitch drop
        osc.type = big ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(big ? 180 : 280, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + (big ? 0.45 : 0.25));

        gain.gain.setValueAtTime(big ? 0.28 : 0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + (big ? 0.45 : 0.25));

        osc.connect(gain);
        gain.connect(AC.destination);

        osc.start(t);
        osc.stop(t + (big ? 0.5 : 0.3));

        // Noise crackle for firecracker sparkles

          const bufferSize = AC.sampleRate * 0.2;
          const buffer = AC.createBuffer(1, bufferSize, AC.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
          }
          const noise = AC.createBufferSource();
          noise.buffer = buffer;
          const noiseGain = AC.createGain();
          noiseGain.gain.setValueAtTime(0.08, t);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
          noise.connect(noiseGain);
          noiseGain.connect(AC.destination);
          noise.start(t);
        }
      } catch (e) {
        // Silently catch audio errors
      }
    }

    // Chime Sound when Diya is lit
    function chimeSound() {
      if (!snd || !AC) return;
      try {
        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const t = AC.currentTime + idx * 0.12;
          const osc = AC.createOscillator();
          const gain = AC.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
          osc.connect(gain);
          gain.connect(AC.destination);
          osc.start(t);
          osc.stop(t + 0.95);
        });
      } catch (e) {}
    }

    // Whoosh Sound for Rocket Launch
    function whooshSound() {
      if (!snd || !AC) return;
      try {
        const t = AC.currentTime;
        const osc = AC.createOscillator();
        const gain = AC.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.9);
        gain.gain.setValueAtTime(0.02, t);
        gain.gain.linearRampToValueAtTime(0.2, t + 0.6);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
        osc.connect(gain);
        gain.connect(AC.destination);
        osc.start(t);
        osc.stop(t + 1.05);
      } catch (e) {}
    }

    // Vibrant Fireworks Color Palette (from the exact video code)
    const COL = ["#ff3d6e", "#ffc83d", "#3dd6ff", "#7dff6b", "#ff7a1f", "#c77dff", "#ffffff"];

    // Boom Particle Explosion (Spherical, Ring, & Parametric Heart)
    function boom(px, py, big) {
      const c = COL[Math.random() * COL.length | 0];
      const c2 = COL[Math.random() * COL.length | 0];
      const n = big ? 120 : 70;
      const ring = Math.random() < 0.35;
      const heart = Math.random() < 0.2;

      for (let i = 0; i < n; i++) {
        let a = i / n * 6.283;
        let s = (big ? 6 : 4) * (ring || heart ? 1 : 0.4 + Math.random());
        let vx = Math.cos(a) * s;
        let vy = Math.sin(a) * s;

        if (heart) {
          const t = a;
          vx = 16 * Math.pow(Math.sin(t), 3) * (big ? 0.45 : 0.3);
          vy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * (big ? 0.45 : 0.3);
        }

        P.push({
          x: px,
          y: py,
          vx: vx,
          vy: vy,
          l: 1,
          d: 0.011 + Math.random() * 0.01,
          c: i % 3 ? c : c2,
          g: 0.045,
          r: 2.2
        });
      }
      pop2(big);
    }

    // Rocket Trail Sparks
    function trail(px, py) {
      P.push({
        x: px,
        y: py,
        vx: (Math.random() - 0.5) * 2.2,
        vy: 2 + Math.random() * 2,
        l: 1,
        d: 0.04,
        c: "#ffb300",
        g: 0,
        r: 2.5
      });
    }

    // Canvas Particle Render Loop
    function loop() {
      x.globalCompositeOperation = 'source-over';
      x.fillStyle = "rgba(13, 2, 22, 0.22)";
      x.fillRect(0, 0, W, H);
      x.globalCompositeOperation = 'lighter';

      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.g;
        p.vx *= 0.985;
        p.l -= p.d;

        if (p.l <= 0) {
          P.splice(i, 1);
          continue;
        }

        x.fillStyle = p.c;
        x.globalAlpha = p.l;
        x.beginPath();
        x.arc(p.x, p.y, Math.max(0.5, p.r * p.l), 0, 6.283);
        x.fill();
      }

      requestAnimationFrame(loop);
    }
    loop();

    // Tap/Click Anywhere on Canvas to launch fireworks!
    cv.addEventListener('pointerdown', (e) => {
      initAudio();
      boom(e.clientX, e.clientY, Math.random() < 0.6);
    });

    // Toast Notification helper
    function showToast(text) {
      const t = $('toast');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    // Stage Management
    const stages = [$('s0'), $('s1'), $('s2'), $('s3')];
    let currentStage = 0;

    function goToStage(idx) {
      currentStage = idx;
      stages.forEach((stg, i) => {
        if (i === idx) {
          stg.classList.add('on');
        } else {
          stg.classList.remove('on');
        }
      });

      // Special stage triggers
      if (idx === 3) {
        startAmbientFireworks();
        if (isRecipientMode) {
          setTimeout(() => {
            const rect = env.getBoundingClientRect();
            boom(rect.left + rect.width / 2, rect.top, true);
          }, 300);
        }
      }
    }

    // STAGE 0: Opening Doors Interaction (Middle Handles & Screen Tap)
    let doorsOpened = false;
    function openDoors() {
      if (doorsOpened) return;
      doorsOpened = true;
      initAudio();
      const wrap = $('door-wrap');
      wrap.classList.add('door-open');
    }

    // Tapping on door container or handles opens the doors
    $('door-wrap').addEventListener('click', openDoors);

    // Tapping the 'Tap to begin' button after opening (or directly) transitions to Stage 1
    $('btn-begin').addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      openDoors();
      setTimeout(() => {
        goToStage(1);
      }, 800);
    });

    // STAGE 1: Light the Diya Action
    let diyaLit = false;
    $('diya-altar').addEventListener('click', () => {
      if (diyaLit) return;
      diyaLit = true;
      initAudio();
      chimeSound();

      $('diya-flame').classList.add('lit');
      $('diya-halo').classList.add('lit');
      $('h1').textContent = "May the divine light illuminate your path ✨";
      $('h1').classList.add('lit');

      // Sparkles burst from diya
      const rect = $('diya-flame').getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      for (let i = 0; i < 35; i++) {
        const a = Math.random() * 6.283;
        const s = 1.5 + Math.random() * 3.5;
        P.push({
          x: cx,
          y: cy,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s - 1.5,
          l: 1,
          d: 0.015 + Math.random() * 0.01,
          c: Math.random() < 0.6 ? "#ffc83d" : "#ff7a1f",
          g: 0.02,
          r: 2.2
        });
      }

      setTimeout(() => {
        goToStage(2);
      }, 1800);
    });

    // STAGE 2: Sky Rocket Double Tap (or Single Tap) Action
    let rocketFired = false;
    let lastTap = 0;

    function fireRocket() {
      if (rocketFired) return;
      rocketFired = true;
      initAudio();
      const rocket = $('rocket');
      rocket.classList.add('ignited');
      $('h3').textContent = "Igniting... 💥";

      // Sizzle for a moment then launch!
      setTimeout(() => {
        whooshSound();
        rocket.classList.add('launching');

        // Emit spark trail while ascending
        let trailInterval = setInterval(() => {
          const rRect = rocket.getBoundingClientRect();
          if (rRect.top < -50 || !rocketFired) {
            clearInterval(trailInterval);
            return;
          }
          trail(rRect.left + rRect.width / 2, rRect.bottom - 40);
        }, 30);

        // Explode at peak
        setTimeout(() => {
          clearInterval(trailInterval);
          $('h3').textContent = "✨ Happy Diwali! ✨";

          // Grand barrage of firecrackers exploding on top
          boom(W / 2, H * 0.20, true);

          setTimeout(() => {
            boom(W / 2 - 130, H * 0.24, true);
          }, 220);

          setTimeout(() => {
            boom(W / 2 + 130, H * 0.22, true);
          }, 460);

          setTimeout(() => {
            boom(W / 2 - 65, H * 0.16, false);
            boom(W / 2 + 70, H * 0.17, false);
          }, 750);

          setTimeout(() => {
            boom(W / 2, H * 0.25, true);
          }, 1100);

          setTimeout(() => {
            boom(W / 2 - 150, H * 0.21, false);
            boom(W / 2 + 150, H * 0.21, false);
          }, 1500);

          // After full fireworks show on top, smoothly shift to the wish card stage
          setTimeout(() => {
            goToStage(3);
          }, 2400);
        }, 950);
      }, 450);
    }

    $('rocket').addEventListener('click', (e) => {
      e.stopPropagation();
      fireRocket();
    });
    $('s2').addEventListener('click', () => {
      fireRocket();
    });

    // STAGE 3: Greeting Cards & Interactive Envelope
    const c1 = $('c1'), c2 = $('c2'), env = $('env'), scr = $('scr');
    let ambientTimer = null;

    function startAmbientFireworks() {
      if (ambientTimer) return;
      ambientTimer = setInterval(() => {
        if (currentStage === 3 && Math.random() < 0.7) {
          const px = W * 0.15 + Math.random() * (W * 0.7);
          const py = H * 0.12 + Math.random() * (H * 0.45);
          boom(px, py, Math.random() < 0.5);
        }
      }, 1400);
    }

    // Toggle Letter Open
    env.addEventListener('click', () => {
      initAudio();
      env.classList.toggle('opened');
      scr.classList.toggle('show');
      if (scr.classList.contains('show')) {
        // Burst celebration sparks
        const rect = env.getBoundingClientRect();
        boom(rect.left + rect.width / 2, rect.top, false);
      }
    });

    // Make Card Button Handler
    $('mk').addEventListener('click', () => {
      initAudio();
      const toVal = $('to-in').value.trim() || 'Kashish';
      const frVal = $('fr-in').value.trim() || 'Shivam';

      $('to').textContent = `${toVal}, शुभ दीपावली`;
      $('by').textContent = `- ${frVal}`;

      c1.classList.remove('active');
      c2.classList.add('active');

      // Auto-open envelope after a smooth beat
      setTimeout(() => {
        env.classList.add('opened');
        scr.classList.add('show');
        const rect = env.getBoundingClientRect();
        boom(rect.left + rect.width / 2, rect.top, true);
      }, 400);
    });

    // Release Sky Lantern Handler
    $('lan').addEventListener('click', () => {
      initAudio();
      const wishInput = $('wish');
      const wishText = wishInput.value.trim() || 'Joy, Love & Light';

      const lantern = document.createElement('div');
      lantern.className = 'sky-lantern';
      // Random horizontal spawn position across center screen
      const startX = 20 + Math.random() * 60;
      lantern.style.left = `${startX}%`;

      const label = document.createElement('div');
      label.className = 'lantern-wish-text';
      label.textContent = wishText;
      lantern.appendChild(label);

      $('lanterns-container').appendChild(lantern);
      wishInput.value = '';

      showToast('🏮 Wish released to the heavens! Happy Diwali ✨');
      // Accompany with soft high chime firework
      const rect = lantern.getBoundingClientRect();
      boom(window.innerWidth * (startX / 100), window.innerHeight * 0.8, false);

      // Clean up after floating out of view
      setTimeout(() => {
        lantern.remove();
      }, 15000);
    });

    // Share Button Handler (Clipboard copy with fallback)
    $('shr').addEventListener('click', () => {
      initAudio();
      let toVal, frVal;
      const urlParams = new URLSearchParams(window.location.search);
      if (isRecipientMode) {
        toVal = urlParams.get('to') || encodeURIComponent('Friend');
        frVal = urlParams.get('from') || encodeURIComponent('Well-wisher');
      } else {
        toVal = encodeURIComponent($('to-in').value.trim() || 'Kashish');
        frVal = encodeURIComponent($('fr-in').value.trim() || 'Shivam');
      }
      const shareUrl = `${window.location.origin}${window.location.pathname}?to=${toVal}&from=${frVal}`;

      if (navigator.share) {
        navigator.share({
          title: 'Happy Diwali Wish ✨',
          text: `Wishing you a sparkling and joyful Diwali! Open your personalized wish:`,
          url: shareUrl
        }).catch(() => copyToClipboard(shareUrl));
      } else {
        copyToClipboard(shareUrl);
      }
    });

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('🔗 Link copied to clipboard! Share the light ✨');
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      try {
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast('🔗 Link copied to clipboard! Share the light ✨');
      } catch (err) {
        showToast('✨ Happy Diwali! Celebrate with your loved ones.');
      }
    }

    // Reset / Make Mine Handler
    $('rst').addEventListener('click', () => {
      initAudio();
      c2.classList.remove('active');
      c1.classList.add('active');
      $('to-in').value = '';
      $('to-in').focus();
    });

    // Sound Mute Toggle Handler
    $('mt').addEventListener('click', () => {
      snd = !snd;
      const bgAudio = $('bg-audio');
      if (snd) {
        $('mt').textContent = '🔊';
        $('mt').title = 'Mute Sound';
        initAudio();
        if (bgAudio) bgAudio.play().catch(() => {});
      } else {
        $('mt').textContent = '🔇';
        $('mt').title = 'Unmute Sound';
        if (bgAudio) bgAudio.pause();
      }
    });

    // Check URL parameters for customized greetings
    let isRecipientMode = false;

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        let toParam = urlParams.get('to');
        let fromParam = urlParams.get('from');

        // Also check hash parameters as fallback (e.g. #to=...&from=...)
        if (!toParam && window.location.hash) {
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          toParam = hashParams.get('to');
          fromParam = hashParams.get('from');
        }

        if (toParam || fromParam) {
          isRecipientMode = true;
          const toName = toParam ? decodeURIComponent(toParam) : 'Dear One';
          const fromName = fromParam ? decodeURIComponent(fromParam) : 'Shivam';

          $('to').textContent = `${toName}, शुभ दीपावली`;
          $('by').textContent = `- ${fromName}`;

          // Directly show the letter at the last page without any name-changing inputs
          c1.style.display = 'none';
          c1.classList.remove('active');
          c2.classList.add('active');

          // Open envelope and display the secret letter scroll directly
          env.classList.add('opened');
          scr.classList.add('show');

          // Remove the part to change names (the 'Make Mine' button)
          const rstBtn = $('rst');
          if (rstBtn) {
            rstBtn.style.display = 'none';
          }
        }
      } catch (e) {
        console.warn('URL parsing error:', e);
      }
    });
  </script>
</body>
</html>
